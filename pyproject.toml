[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "shimeji-dl"
version = "0.7.0"
description = "Asynchronous Shimeji package downloader with pluggable sources and adaptive asset discovery"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1",
    "lxml>=6.1.3,<7",
    "msgspec>=0.21.1,<0.22",
    "pathvalidate>=3.3.1,<4",
    "pillow>=12.3.0,<13",
    "rich>=15.0.0,<16",
    "tenacity>=9.1.4,<10",
    "typer>=0.27.2,<1",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.scripts]
shimeji-dl = "shimeji_dl.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "types-lxml==2026.2.16",
    "check-wheel-contents==0.6.3",
    "twine==7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"!src/**" = ["S"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/shimeji_dl/core",
    "src/shimeji_dl/formats",
    "src/shimeji_dl/sources",
    "src/shimeji_dl/ui",
    "src/shimeji_dl/version.py",
]
