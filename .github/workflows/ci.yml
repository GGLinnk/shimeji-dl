name: CI

on:
  push:
  pull_request:

env:
  DIST_ARTIFACT_PREFIX: dist
  TOOLCHAIN_PYTHON_VERSION: "3.14"

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.TOOLCHAIN_PYTHON_VERSION }}

      - name: Ruff lint
        run: uv run --frozen --group dev ruff check src tests .github/scripts

      - name: Ruff security
        run: uv run --frozen --group dev ruff check --select S src

      - name: Mypy
        run: uv run --frozen --group dev mypy

      - name: Audit dependencies
        run: uv run --frozen --group dev pip-audit .

  python_matrix:
    name: Derive Python matrix
    runs-on: ubuntu-latest

    outputs:
      python-versions: ${{ steps.derive.outputs.python-versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.TOOLCHAIN_PYTHON_VERSION }}

      - name: Derive supported Python versions from classifiers
        id: derive
        run: uv run --no-project python .github/scripts/python_matrix.py

  test:
    name: Python ${{ matrix.python-version }}
    needs: python_matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python_matrix.outputs.python-versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run --frozen pytest

  package:
    name: Build release artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.TOOLCHAIN_PYTHON_VERSION }}

      - name: Verify lockfile
        run: uv lock --check

      - name: Export SOURCE_DATE_EPOCH from the built commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uv run --frozen --group dev twine check --strict dist/*

      - name: Check wheel contents
        run: uv run --frozen --group dev check-wheel-contents dist/*.whl

      - name: Smoke test distributions
        run: uv run --locked python .github/scripts/smoke_dist.py

      - name: Verify byte-reproducibility from two fresh clones
        run: uv run --locked python .github/scripts/reproducible_build.py

      - name: Generate SLSA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DIST_ARTIFACT_PREFIX }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
