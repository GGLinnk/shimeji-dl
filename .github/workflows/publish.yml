name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  DIST_ARTIFACT_PREFIX: dist

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      mode: ${{ steps.release.outputs.mode }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"

      - name: Resolve release metadata
        id: release
        run: uv run --no-project --with packaging python .github/scripts/release.py

  qualify:
    name: Qualify CI artifact
    needs: prepare
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    outputs:
      run-id: ${{ steps.qualify.outputs.run-id }}
      artifact-name: ${{ steps.qualify.outputs.artifact-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find qualified CI artifact
        id: qualify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          DIST_ARTIFACT_PREFIX: ${{ env.DIST_ARTIFACT_PREFIX }}
        with:
          retries: 3
          script: |
            const release = require('./.github/scripts/release.cjs');
            await release.qualify({ github, context, core });

  tag:
    name: Create release tag
    if: needs.prepare.outputs.mode == 'prepare'
    needs:
      - prepare
      - qualify
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create tag and dispatch tagged release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          retries: 3
          script: |
            const release = require('./.github/scripts/release.cjs');
            await release.createTagAndDispatch({ github, context, core });

  publish:
    name: Publish to PyPI
    if: needs.prepare.outputs.mode == 'publish'
    needs:
      - prepare
      - qualify
    runs-on: ubuntu-latest

    environment:
      name: shimeji-dl
      url: https://pypi.org/project/shimeji-dl/

    permissions:
      actions: read
      id-token: write

    steps:
      - name: Download qualified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.qualify.outputs.artifact-name }}
          path: dist
          run-id: ${{ needs.qualify.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true

  release:
    name: Create GitHub Release
    if: needs.prepare.outputs.mode == 'publish'
    needs:
      - prepare
      - qualify
      - publish
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download qualified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.qualify.outputs.artifact-name }}
          path: dist
          run-id: ${{ needs.qualify.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Create or complete GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          retries: 3
          script: |
            const release = require('./.github/scripts/release.cjs');
            await release.createRelease({ github, context, core });
