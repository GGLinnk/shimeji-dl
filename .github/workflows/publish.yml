name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      mode: ${{ steps.release.outputs.mode }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release metadata
        id: release
        run: python .github/scripts/release.py

  qualify:
    name: Qualify CI artifact
    needs: prepare
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    outputs:
      run-id: ${{ steps.qualify.outputs.run-id }}
      artifact-name: ${{ steps.qualify.outputs.artifact-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Find qualified CI artifact
        id: qualify
        uses: actions/github-script@v9.0.0
        env:
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const release = require('./.github/scripts/release.cjs');
            await release.qualify({ github, context, core });

  tag:
    name: Create release tag
    if: needs.prepare.outputs.mode == 'prepare'
    needs:
      - prepare
      - qualify
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Create tag and dispatch tagged release
        uses: actions/github-script@v9.0.0
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const release = require('./.github/scripts/release.cjs');
            await release.createTagAndDispatch({ github, context, core });

  publish:
    name: Publish to PyPI
    if: needs.prepare.outputs.mode == 'publish'
    needs:
      - prepare
      - qualify
    runs-on: ubuntu-latest

    environment:
      name: shimeji-dl
      url: https://pypi.org/project/shimeji-dl/

    permissions:
      actions: read
      id-token: write

    steps:
      - name: Download qualified distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.qualify.outputs.artifact-name }}
          path: dist
          run-id: ${{ needs.qualify.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true

  release:
    name: Create GitHub Release
    if: needs.prepare.outputs.mode == 'publish'
    needs:
      - prepare
      - qualify
      - publish
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download qualified distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.qualify.outputs.artifact-name }}
          path: dist
          run-id: ${{ needs.qualify.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Create or complete GitHub Release
        uses: actions/github-script@v9.0.0
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const release = require('./.github/scripts/release.cjs');
            await release.createRelease({ github, context, core });
